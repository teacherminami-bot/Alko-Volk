<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Алко-Волк: 3D Безумие</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: absolute; top: 15px; left: 15px; color: #fff;
    font-size: 22px; font-weight: bold; text-shadow: 2px 2px #000;
    pointer-events: none;
  }
  .controls {
    position: absolute; bottom: 20px; width: 100%; display: flex;
    justify-content: space-between; padding: 0 20px; pointer-events: none;
  }
  .btn-group { display: flex; gap: 15px; pointer-events: auto; }
  .c-btn {
    width: 75px; height: 75px; background: rgba(255,255,255,0.25);
    border: 3px solid rgba(255,255,255,0.6); border-radius: 50%;
    color: white; font-size: 24px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  .c-btn:active { background: rgba(255,255,255,0.5); transform: scale(0.95); }
  .action-btn { background: rgba(220,50,50,0.6); border-color: rgba(255,100,100,0.8); }
</style>
<!-- Подключаем 3D движок Three.js из надежного CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="hud">Очки: <span id="scoreVal">0</span> | Жизни: ❤️x<span id="lifeVal">3</span></div>

<div class="controls">
  <div class="btn-group">
    <div class="c-btn" id="leftBtn">◀</div>
    <div class="c-btn" id="rightBtn">▶</div>
  </div>
  <div class="btn-group">
    <div class="c-btn action-btn" id="fartBtn" style="background:rgba(100,200,20,0.7);">ПУК</div>
    <div class="c-btn action-btn" id="jumpBtn">ПРЫГ</div>
  </div>
</div>

<script>
let scene, camera, renderer;
let wolf, platforms = [], snacks = [], grannies = [], particles = [];
let score = 0, lives = 3;
let moveLeft = false, moveRight = false, isJumping = false;
let wolfVy = 0;
const gravity = 0.015;

function init3D() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 5, 12);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Освещение
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(20, 40, 20);
  dirLight.castShadow = true;
  scene.add(dirLight);

  createLevel();
  initControls();
  window.addEventListener('resize', onWindowResize);
}

function createLevel() {
  // Платформы (дорога и крыши)
  const platGeo = new THREE.BoxGeometry(30, 1, 6);
  const platMat = new THREE.MeshStandardMaterial({ color: 0x5c6b73 });
  
  const p1 = new THREE.Mesh(platGeo, platMat);
  p1.position.set(0, -1, 0);
  scene.add(p1);
  platforms.push(p1);

  const p2 = new THREE.Mesh(new THREE.BoxGeometry(12, 1, 5), platMat);
  p2.position.set(8, 2, 0);
  scene.add(p2);
  platforms.push(p2);

  // Главный герой — Волк (3D модель из примитивов со стилем)
  const wolfGroup = new THREE.Group();
  
  // Тело
  const bodyMesh = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 1.8, 0.8),
    new THREE.MeshStandardMaterial({ color: 0x7d8597 })
  );
  bodyMesh.position.y = 0.9;
  wolfGroup.add(bodyMesh);

  // Голова
  const headMesh = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshStandardMaterial({ color: 0x6c757d })
  );
  headMesh.position.set(0, 2.1, 0.2);
  wolfGroup.add(headMesh);

  // Шорты
  const shortsMesh = new THREE.Mesh(
    new THREE.BoxGeometry(1.25, 0.8, 0.85),
    new THREE.MeshStandardMaterial({ color: 0xff5722 })
  );
  shortsMesh.position.y = 0.2;
  wolfGroup.add(shortsMesh);

  wolf = wolfGroup;
  wolf.position.set(-8, 1, 0);
  scene.add(wolf);

  // Спавним банку (закуску)
  const snackMesh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.3, 0.8, 12),
    new THREE.MeshStandardMaterial({ color: 0x0055d4 })
  );
  snackMesh.position.set(4, 0.5, 0);
  scene.add(snackMesh);
  snacks.push(snackMesh);

  // Спавним Злую Бабку
  const grannyGroup = new THREE.Group();
  const gBody = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 2, 0.8),
    new THREE.MeshStandardMaterial({ color: 0x6d4c41 })
  );
  gBody.position.y = 1;
  grannyGroup.add(gBody);

  const gHead = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0xd32f2f })
  );
  gHead.position.set(0, 2.3, 0);
  grannyGroup.add(gHead);

  grannyGroup.position.set(10, 0, 0);
  scene.add(grannyGroup);
  grannies.push({ mesh: grannyGroup, alive: true });
}

function spawnExplosion(pos) {
  const pCount = 25;
  const geo = new THREE.BoxGeometry(0.25, 0.25, 0.25);
  const mat = new THREE.MeshBasicMaterial({ color: 0xff4500 });

  for (let i = 0; i < pCount; i++) {
    const p = new THREE.Mesh(geo, mat);
    p.position.copy(pos);
    scene.add(p);
    particles.push({
      mesh: p,
      vx: (Math.random() - 0.5) * 0.3,
      vy: Math.random() * 0.3 + 0.1,
      vz: (Math.random() - 0.5) * 0.3,
      life: 40
    });
  }
}

function triggerFart() {
  spawnExplosion(wolf.position);
  // Проверяем бабок поблизости для взрыва
  grannies.forEach(g => {
    if (g.alive && g.mesh.position.distanceTo(wolf.position) < 6) {
      g.alive = false;
      scene.remove(g.mesh);
      spawnExplosion(g.mesh.position);
      score += 100;
      document.getElementById('scoreVal').innerText = score;
    }
  });
}

function initControls() {
  const bindButton = (id, startAction, endAction) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); startAction(); });
    el.addEventListener('touchend', (e) => { e.preventDefault(); endAction(); });
    el.addEventListener('mousedown', (e) => { startAction(); });
    el.addEventListener('mouseup', (e) => { endAction(); });
  };

  bindButton('leftBtn', () => moveLeft = true, () => moveLeft = false);
  bindButton('rightBtn', () => moveRight = true, () => moveRight = false);
  bindButton('jumpBtn', () => {
    if (!isJumping) {
      wolfVy = 0.35;
      isJumping = true;
    }
  }, () => {});
  
  const fartEl = document.getElementById('fartBtn');
  fartEl.addEventListener('touchstart', (e) => { e.preventDefault(); triggerFart(); });
  fartEl.addEventListener('mousedown', () => { triggerFart(); });
}

function update() {
  // Движение волка
  const speed = 0.12;
  if (moveLeft) wolf.position.x -= speed;
  if (moveRight) wolf.position.x += speed;

  // Гравитация и прыжок
  wolfVy -= gravity;
  wolf.position.y += wolfVy;

  // Простая коллизия с полом
  if (wolf.position.y < 1) {
    wolf.position.y = 1;
    wolfVy = 0;
    isJumping = false;
  }

  // Камера следует за волком в 3D
  camera.position.x = wolf.position.x;
  camera.position.y = wolf.position.y + 4;

  // Сбор банок
  snacks.forEach((s, index) => {
    if (s && s.position.distanceTo(wolf.position) < 1.5) {
      scene.remove(s);
      snacks.splice(index, 1);
      score += 50;
      document.getElementById('scoreVal').innerText = score;
    }
  });

  // Анимация частиц взрывов
  particles.forEach((p, index) => {
    p.mesh.position.x += p.vx;
    p.mesh.position.y += p.vy;
    p.mesh.position.z += p.vz;
    p.vy -= 0.01;
    p.life--;
    if (p.life <= 0) {
      scene.remove(p.mesh);
      particles.splice(index, 1);
    }
  });
}

function animate() {
  requestAnimationFrame(animate);
  update();
  renderer.render(scene, camera);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

init3D();
animate();
</script>
</body>
</html>
