<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Алко-Волк: Уличный Беспредел</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let V_WIDTH = 1280;
let V_HEIGHT = 720;
let scale = 1;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  scale = canvas.height / V_HEIGHT;
  V_WIDTH = canvas.width / scale;
  updateButtons();
}
window.addEventListener('resize', resize);

// Игровые переменные
let wolfX = 200, wolfZ = 350, wolfY = 0, wolfVy = 0;
const wolfW = 75, wolfH = 110;
let isJumping = false;
let score = 0, lives = 3;

let moveUp = false, moveDown = false, moveLeft = false, moveRight = false;

// Кнопки управления
let btnUp = {}, btnDown = {}, btnLeft = {}, btnRight = {}, btnFart = {}, btnJump = {};

function updateButtons() {
  const by = V_HEIGHT - 130;
  btnLeft  = { x: 30, y: by + 45, r: 40 };
  btnRight = { x: 150, y: by + 45, r: 40 };
  btnUp    = { x: 90, y: by - 15, r: 40 };
  btnDown  = { x: 90, y: by + 105, r: 40 };

  btnFart = { x: V_WIDTH - 240, y: by + 35, w: 90, h: 80 };
  btnJump = { x: V_WIDTH - 130, y: by + 35, w: 100, h: 80 };
}

// Объекты мира
let snacks = [
  { x: 500, z: 320, type: 0, collected: false },
  { x: 800, z: 380, type: 0, collected: false },
  { x: 1200, z: 300, type: 1, collected: false },
  { x: 1600, z: 360, type: 0, collected: false }
];

let grannies = [
  { x: 650, z: 350, speed: 2, dead: false },
  { x: 1050, z: 320, speed: -2.5, dead: false },
  { x: 1500, z: 370, speed: 2.2, dead: false }
];

let explosions = [];

function triggerFart() {
  explosions.push({ x: wolfX + wolfW/2, z: wolfZ, r: 10, alpha: 1 });
  grannies.forEach(g => {
    if (!g.dead && Math.hypot(g.x - wolfX, g.z - wolfZ) < 120) {
      g.dead = true;
      score += 100;
    }
  });
}

function update() {
  const speed = 6;
  if (moveLeft) wolfX -= speed;
  if (moveRight) wolfX += speed;
  if (moveUp) wolfZ -= speed;
  if (moveDown) wolfZ += speed;

  // Границы дороги
  wolfX = Math.max(50, Math.max(0, wolfX));
  wolfZ = Math.max(250, Math.min(520, wolfZ));

  // Гравитация
  wolfVy += 1.2;
  wolfY += wolfVy;
  if (wolfY > 0) {
    wolfY = 0;
    wolfVy = 0;
    isJumping = false;
  }

  // Сбор банок
  snacks.forEach(s => {
    if (!s.collected && Math.hypot(s.x - (wolfX + wolfW/2), s.z - wolfZ) < 50) {
      s.collected = true;
      score += 50;
    }
  });

  // Движение бабок
  grannies.forEach(g => {
    if (!g.dead) {
      g.x += g.speed;
      if (g.x < wolfX - 400 || g.x > wolfX + 600) g.speed = -g.speed;
    }
  });

  // Анимация взрывов
  explosions.forEach(e => {
    e.r += 4;
    e.alpha -= 0.03;
  });
  explosions = explosions.filter(e => e.alpha > 0);
}

function draw() {
  ctx.save();
  ctx.scale(scale, scale);

  // Небо
  ctx.fillStyle = "#87CEEB";
  ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

  // Дорога (асфальт)
  ctx.fillStyle = "#333333";
  ctx.beginPath();
  ctx.moveTo(0, 220);
  ctx.lineTo(V_WIDTH, 220);
  ctx.lineTo(V_WIDTH, 650);
  ctx.lineTo(0, 650);
  ctx.fill();

  // Разметка
  ctx.strokeStyle = "#FFEB3B";
  ctx.lineWidth = 6;
  ctx.setLineDash([30, 20]);
  ctx.beginPath();
  ctx.moveTo(0, 435);
  ctx.lineTo(V_WIDTH, 435);
  ctx.stroke();
  ctx.setLineDash([]);

  // Отрисовка банок
  snacks.forEach(s => {
    if (!s.collected) {
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(s.x - wolfX + 200 - 12, s.z, 24, 35);
      ctx.fillStyle = "#0055D4";
      ctx.fillRect(s.x - wolfX + 200 - 12, s.z + 10, 24, 15);
    }
  });

  // Отрисовка бабок
  grannies.forEach(g => {
    if (!g.dead) {
      const gx = g.x - wolfX + 200;
      ctx.fillStyle = "#6D4C41";
      ctx.fillRect(gx - 20, g.z - 60, 40, 65);
      ctx.fillStyle = "#D32F2F";
      ctx.beginPath();
      ctx.arc(gx, g.z - 70, 18, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // Отрисовка Волка
  const wx = 200;
  const wy = wolfZ + wolfY;
  
  // Тени
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath();
  ctx.ellipse(wx + wolfW/2, wolfZ + 15, 30, 12, 0, 0, Math.PI*2);
  ctx.fill();

  // Шорты
  ctx.fillStyle = "#FF5722";
  ctx.fillRect(wx + 10, wy - 50, wolfW - 20, 35);
  // Торс
  ctx.fillStyle = "#7D8597";
  ctx.fillRect(wx + 12, wy - 95, wolfW - 24, 48);
  // Голова в наушниках
  ctx.fillStyle = "#6C757D";
  ctx.beginPath();
  ctx.arc(wx + wolfW/2, wy - 110, 22, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "#00F5D4"; // Наушники
  ctx.fillRect(wx - 2, wy - 120, 10, 20);
  ctx.fillRect(wx + wolfW - 8, wy - 120, 10, 20);

  // Взрывы пука
  explosions.forEach(e => {
    ctx.fillStyle = `rgba(255, 100, 0, ${e.alpha})`;
    ctx.beginPath();
    ctx.arc(e.x - wolfX + 200, e.z, e.r, 0, Math.PI*2);
    ctx.fill();
  });

  // HUD
  ctx.fillStyle = "#000";
  ctx.font = "bold 28px sans-serif";
  ctx.fillText(`ОЧКИ: ${score}   ЖИЗНИ: ❤️x${lives}`, 30, 45);

  // Кнопки управления (джойстик)
  function drawCircleBtn(btn, text) {
    ctx.fillStyle = "rgba(40,40,40,0.6)";
    ctx.beginPath();
    ctx.arc(btn.x, btn.y, btn.r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = "white";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = "white";
    ctx.font = "bold 24px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, btn.x, btn.y);
  }

  drawCircleBtn(btnLeft, "◀");
  drawCircleBtn(btnRight, "▶");
  drawCircleBtn(btnUp, "▲");
  drawCircleBtn(btnDown, "▼");

  // Кнопка Пук
  ctx.fillStyle = "rgba(100, 200, 20, 0.85)";
  ctx.fillRect(btnFart.x, btnFart.y, btnFart.w, btnFart.h);
  ctx.fillStyle = "white";
  ctx.font = "bold 22px sans-serif";
  ctx.fillText("ПУК!", btnFart.x + btnFart.w/2, btnFart.y + btnFart.h/2);

  // Кнопка Прыг
  ctx.fillStyle = "rgba(220, 50, 50, 0.85)";
  ctx.fillRect(btnJump.x, btnJump.y, btnJump.w, btnJump.h);
  ctx.fillText("ПРЫГ", btnJump.x + btnJump.w/2, btnJump.y + btnJump.h/2);

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Обработка касаний
function checkTouch(x, y) {
  moveLeft = Math.hypot(x - btnLeft.x, y - btnLeft.y) < btnLeft.r;
  moveRight = Math.hypot(x - btnRight.x, y - btnRight.y) < btnRight.r;
  moveUp = Math.hypot(x - btnUp.x, y - btnUp.y) < btnUp.r;
  moveDown = Math.hypot(x - btnDown.x, y - btnDown.y) < btnDown.r;
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  for(let i=0; i<e.touches.length; i++) {
    const tx = e.touches[i].clientX / scale;
    const ty = e.touches[i].clientY / scale;
    checkTouch(tx, ty);
    
    if (tx > btnFart.x && tx < btnFart.x + btnFart.w && ty > btnFart.y && ty < btnFart.y + btnFart.h) {
      triggerFart();
    }
    if (tx > btnJump.x && tx < btnJump.x + btnJump.w && ty > btnJump.y && ty < btnJump.y + btnJump.h) {
      if (wolfY === 0) { wolfVy = -22; isJumping = true; }
    }
  }
}, {passive: false});

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  moveLeft = false; moveRight = false; moveUp = false; moveDown = false;
}, {passive: false});

resize();
loop();
</script>
</body>
</html>
