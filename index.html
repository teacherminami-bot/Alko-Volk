<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Алко-Волк: Спасение Принцессы Зайки</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: #87CEEB;
    overflow: hidden;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Фиксированная виртуальная высота мира под координаты из твоего кода
const V_HEIGHT = 760;
let V_WIDTH = 1280;
let scale = 1;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  scale = canvas.height / V_HEIGHT;
  V_WIDTH = canvas.width / scale;
  updateButtonsLayout();
}
window.addEventListener('resize', resize);

// Камера и физика
let cameraX = 0;
const gravity = 1.4;

// Главный герой: Волк в шортах и DJ-наушниках
let wolfX = 120;
let wolfY = 300;
const wolfW = 70;
const wolfH = 110;
let wolfVy = 0;
let facingRight = true;
let isJumping = false;
let moveLeft = false;
let moveRight = false;

// Статистика и запасы газа
let score = 0;
let lives = 3;
let gasMeter = 100;
let levelCompleted = false;
let levelNum = 1;

let platforms = [];
let snacks = [];
let grannies = [];
let gasClouds = [];

const princessRect = { left: 2680, top: 480, right: 2750, bottom: 590 };

// Кнопки управления
let btnLeft = { left: 0, top: 0, right: 0, bottom: 0 };
let btnRight = { left: 0, top: 0, right: 0, bottom: 0 };
let btnFart = { left: 0, top: 0, right: 0, bottom: 0 };
let btnBurp = { left: 0, top: 0, right: 0, bottom: 0 };
let btnJump = { left: 0, top: 0, right: 0, bottom: 0 };

function updateButtonsLayout() {
  const isPortrait = V_WIDTH < 750;
  const bw = isPortrait ? Math.min(115, V_WIDTH * 0.17) : 120;
  const bh = 105;
  const by = V_HEIGHT - bh - 20;
  const gap = isPortrait ? 10 : 18;

  btnLeft = { left: 20, top: by, right: 20 + bw, bottom: by + bh };
  btnRight = { left: 20 + bw + gap, top: by, right: 20 + bw * 2 + gap, bottom: by + bh };

  btnJump = { left: V_WIDTH - 20 - bw, top: by, right: V_WIDTH - 20, bottom: by + bh };
  btnBurp = { left: btnJump.left - gap - bw, top: by, right: btnJump.left - gap, bottom: by + bh };
  btnFart = { left: btnBurp.left - gap - bw, top: by, right: btnBurp.left - gap, bottom: by + bh };
}

function setupLevel() {
  platforms = [];
  snacks = [];
  grannies = [];
  gasClouds = [];
  levelCompleted = false;

  wolfX = 120;
  wolfY = 350;
  wolfVy = 0;

  // Уровень в стиле двора/автобусной остановки (длина 2950 пикселей)
  platforms.push({ left: 0, top: 590, right: 950, bottom: 800 });
  platforms.push({ left: 1080, top: 590, right: 2000, bottom: 800 });
  platforms.push({ left: 2120, top: 590, right: 2950, bottom: 800 });

  // Крыши ларьков, лавочки и остановки
  platforms.push({ left: 280, top: 440, right: 520, bottom: 470 });
  platforms.push({ left: 650, top: 320, right: 920, bottom: 350 });
  platforms.push({ left: 1250, top: 430, right: 1550, bottom: 460 });
  platforms.push({ left: 1650, top: 310, right: 1950, bottom: 340 });
  platforms.push({ left: 2250, top: 440, right: 2500, bottom: 470 });

  // Закуски: 0-Банка сине-белая, 1-Камамбер, 2-Чипсы, 3-Рыбка
  snacks.push({ x: 320, y: 380, type: 0, collected: false });
  snacks.push({ x: 420, y: 380, type: 2, collected: false });
  snacks.push({ x: 700, y: 260, type: 1, collected: false });
  snacks.push({ x: 820, y: 260, type: 3, collected: false });
  snacks.push({ x: 1150, y: 520, type: 0, collected: false });
  snacks.push({ x: 1350, y: 370, type: 1, collected: false });
  snacks.push({ x: 1450, y: 370, type: 3, collected: false });
  snacks.push({ x: 1750, y: 250, type: 0, collected: false });
  snacks.push({ x: 1850, y: 250, type: 2, collected: false });
  snacks.push({ x: 2320, y: 380, type: 1, collected: false });
  snacks.push({ x: 2420, y: 380, type: 0, collected: false });

  // Злые бабки на маршруте (скорость растёт с каждым уровнем!)
  const mult = 1 + (levelNum - 1) * 0.15;
  grannies.push({ x: 500, y: 490, minX: 420, maxX: 880, speed: 3.5 * mult, dead: false });
  grannies.push({ x: 720, y: 220, minX: 660, maxX: 860, speed: 3.0 * mult, dead: false });
  grannies.push({ x: 1300, y: 490, minX: 1120, maxX: 1900, speed: 4.5 * mult, dead: false });
  grannies.push({ x: 1320, y: 330, minX: 1260, maxX: 1500, speed: 3.2 * mult, dead: false });
  grannies.push({ x: 2280, y: 490, minX: 2150, maxX: 2550, speed: 4.0 * mult, dead: false });
}

function intersects(a, b) {
  return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
}

// Газовая атака (ПУК!)
function triggerFart() {
  if (gasMeter >= 20) {
    gasMeter -= 20;
    const dir = facingRight ? -1 : 1; // Пук летит назад из шорт
    const startX = facingRight ? wolfX - 10 : wolfX + wolfW + 10;
    gasClouds.push({ x: startX, y: wolfY + wolfH * 0.65, vx: dir * 11, isBurp: false, timer: 35 });
    // Реактивный подброс в воздухе как в Boogerman!
    if (isJumping) wolfVy = -18;
  }
}

// Звуковая отрыжка (РЫГ!)
function triggerBurp() {
  if (gasMeter >= 20) {
    gasMeter -= 20;
    const dir = facingRight ? 1 : -1; // Отрыжка летит вперед изо рта
    const startX = facingRight ? wolfX + wolfW + 15 : wolfX - 15;
    gasClouds.push({ x: startX, y: wolfY + 25, vx: dir * 14, isBurp: true, timer: 35 });
  }
}

function update() {
  if (levelCompleted) return;

  const speed = 9;
  if (moveLeft) {
    wolfX -= speed;
    facingRight = false;
  }
  if (moveRight) {
    wolfX += speed;
    facingRight = true;
  }
  if (wolfX < 0) wolfX = 0;

  wolfVy += gravity;
  wolfY += wolfVy;

  // Приземление на платформы
  for (const p of platforms) {
    if (wolfX + wolfW > p.left && wolfX < p.right &&
        wolfY + wolfH >= p.top && wolfY + wolfH - wolfVy <= p.top + 22 && wolfVy >= 0) {
      wolfY = p.top - wolfH;
      wolfVy = 0;
      isJumping = false;
    }
  }

  // Камера следует за Волком
  cameraX = Math.max(0, wolfX - V_WIDTH * 0.3);

  // Падение в люк/яму
  if (wolfY > V_HEIGHT + 100) {
    lives--;
    if (lives <= 0) {
      lives = 3;
      score = 0;
      levelNum = 1;
    }
    setupLevel();
    return;
  }

  const wolfRect = { left: wolfX, top: wolfY, right: wolfX + wolfW, bottom: wolfY + wolfH };

  // Сбор закусок
  for (const s of snacks) {
    if (!s.collected) {
      const sRect = { left: s.x, top: s.y, right: s.x + 48, bottom: s.y + 48 };
      if (intersects(wolfRect, sRect)) {
        s.collected = true;
        score += (s.type === 0) ? 20 : (s.type === 1) ? 30 : (s.type === 2) ? 15 : 25;
        gasMeter = Math.min(100, gasMeter + 25);
      }
    }
  }

  // Обновление облаков пука и отрыжки
  for (let i = gasClouds.length - 1; i >= 0; i--) {
    gasClouds[i].x += gasClouds[i].vx;
    gasClouds[i].timer--;
    if (gasClouds[i].timer <= 0) gasClouds.splice(i, 1);
  }

  // Движение злых бабок и бой
  for (const g of grannies) {
    if (g.dead) continue;
    g.x += g.speed;
    if (g.x > g.maxX || g.x < g.minX) g.speed = -g.speed;

    const gRect = { left: g.x, top: g.y, right: g.x + 65, bottom: g.y + 100 };

    // 1. Попадание облаком пука или отрыжки по бабке
    for (const c of gasClouds) {
      const cRect = { left: c.x - 45, top: c.y - 45, right: c.x + 45, bottom: c.y + 45 };
      if (intersects(cRect, gRect)) {
        g.dead = true;
        score += 50;
      }
    }

    // 2. Прыжок на голову бабке в стиле Марио или столкновение
    if (!g.dead && intersects(wolfRect, gRect)) {
      if (wolfVy > 0 && wolfY + wolfH - wolfVy <= g.y + 34) {
        g.dead = true;
        wolfVy = -20;
        score += 40;
      } else {
        lives--;
        if (lives <= 0) {
          lives = 3;
          score = 0;
          levelNum = 1;
        }
        setupLevel();
        return;
      }
    }
  }

  // Спасение Принцессы-Зайки в конце уровня
  if (intersects(wolfRect, princessRect)) {
    levelCompleted = true;
    score += 200;
  }
}

function fillRoundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fill();
}

function fillOval(left, top, right, bottom) {
  const rx = (right - left) / 2;
  const ry = (bottom - top) / 2;
  ctx.beginPath();
  ctx.ellipse(left + rx, top + ry, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawWolf() {
  // Лапы
  ctx.fillStyle = "#6C757D";
  ctx.fillRect(wolfX + 12, wolfY + 80, 14, wolfH - 80);
  ctx.fillRect(wolfX + 42, wolfY + 80, 14, wolfH - 80);

  // Пушистый хвост
  fillOval(
    facingRight ? wolfX - 22 : wolfX + wolfW - 5,
    wolfY + 55,
    facingRight ? wolfX + 8 : wolfX + wolfW + 25,
    wolfY + 75
  );

  // Яркие пляжные/уличные шорты
  ctx.fillStyle = "#FF5722";
  fillRoundRect(wolfX + 8, wolfY + 55, wolfW - 16, 33, 8);

  // Торс волка
  ctx.fillStyle = "#7D8597";
  fillRoundRect(wolfX + 10, wolfY + 26, wolfW - 20, 36, 10);

  // Голова с вытянутой мордой
  const snoutX = facingRight ? wolfX + 35 : wolfX - 12;
  fillRoundRect(wolfX + 12, wolfY, wolfW - 24, 34, 8);
  fillRoundRect(snoutX, wolfY + 10, 38, 20, 6);

  // Нос и глаз
  ctx.fillStyle = "#000000";
  ctx.beginPath();
  ctx.arc(facingRight ? snoutX + 35 : snoutX + 3, wolfY + 15, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.arc(wolfX + 35, wolfY + 12, 5, 0, Math.PI * 2);
  ctx.fill();

  // Массивные ДИДЖЕЙСКИЕ НАУШНИКИ на голове Волка!
  ctx.strokeStyle = "#111111";
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.ellipse(wolfX + 35, wolfY + 5, 21, 15, 0, Math.PI, Math.PI * 2);
  ctx.stroke();

  // Амбушюра с ярким неоново-зеленым ободком
  ctx.fillStyle = "#00F5D4";
  ctx.beginPath();
  ctx.arc(wolfX + 32, wolfY + 16, 12, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#222222";
  ctx.beginPath();
  ctx.arc(wolfX + 32, wolfY + 16, 8, 0, Math.PI * 2);
  ctx.fill();
}

function drawPrincessBunny() {
  const px = princessRect.left;
  const py = princessRect.top;

  // Длинные белые заячьи уши
  ctx.fillStyle = "#FFFFFF";
  fillOval(px + 12, py - 35, px + 26, py + 15);
  fillOval(px + 38, py - 35, px + 52, py + 15);

  // Корона принцессы
  ctx.fillStyle = "#FFD700";
  ctx.fillRect(px + 20, py - 12, 26, 12);

  // Голова Зайки
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.arc(px + 33, py + 20, 20, 0, Math.PI * 2);
  ctx.fill();

  // Глазки и носик Зайки
  ctx.fillStyle = "#FF1493";
  ctx.beginPath();
  ctx.arc(px + 27, py + 18, 3, 0, Math.PI * 2);
  ctx.fill();

  // Розовое пышное платье
  ctx.fillStyle = "#FF69B4";
  ctx.beginPath();
  ctx.moveTo(px + 33, py + 35);
  ctx.lineTo(px + 5, py + 110);
  ctx.lineTo(px + 62, py + 110);
  ctx.closePath();
  ctx.fill();
}

function drawButton(btn, bg, text, fontSize) {
  ctx.fillStyle = bg;
  fillRoundRect(btn.left, btn.top, btn.right - btn.left, btn.bottom - btn.top, 20);
  ctx.fillStyle = "#FFFFFF";
  ctx.font = `bold ${fontSize}px sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, (btn.left + btn.right) / 2, (btn.top + btn.bottom) / 2);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
}

function drawHUD() {
  ctx.fillStyle = "#000000";
  ctx.font = "bold 28px sans-serif";
  ctx.fillText(`Очки закусок: ${score}   Жизни: ❤️x${lives}   Ур: ${levelNum}`, 30, 48);

  // Шкала газа
  ctx.fillStyle = "#444444";
  fillRoundRect(30, 65, 300, 32, 10);
  ctx.fillStyle = "#7CB518";
  if (gasMeter > 0) {
    fillRoundRect(30, 65, gasMeter * 3, 32, 10);
  }
  ctx.fillStyle = "#FFFFFF";
  ctx.font = "bold 20px sans-serif";
  ctx.fillText(`ГАЗ И ОТРЫЖКА: ${gasMeter}%`, 48, 88);

  // Сенсорные кнопки
  drawButton(btnLeft, "rgba(30, 30, 30, 0.55)", "◀", 38);
  drawButton(btnRight, "rgba(30, 30, 30, 0.55)", "▶", 38);
  drawButton(btnFart, "rgba(100, 180, 20, 0.8)", "ПУК!", 26);
  drawButton(btnBurp, "rgba(230, 120, 20, 0.8)", "РЫГ!", 26);
  drawButton(btnJump, "rgba(30, 30, 30, 0.65)", "ПРЫГ", 26);
}

function draw() {
  ctx.save();
  ctx.scale(scale, scale);

  // Яркое мультяшное небо
  ctx.fillStyle = "#87CEEB";
  ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

  ctx.save();
  ctx.translate(-cameraX, 0);

  // Отрисовка платформ (асфальт с зеленым газоном)
  for (const p of platforms) {
    ctx.fillStyle = "#5C6B73";
    fillRoundRect(p.left, p.top, p.right - p.left, p.bottom - p.top, 12);
    ctx.fillStyle = "#7CB518";
    ctx.fillRect(p.left, p.top, p.right - p.left, 16);
  }

  // Отрисовка закусок: 0-Банка сине-белая, 1-Камамбер, 2-Чипсы, 3-Сушеная рыбка
  for (const s of snacks) {
    if (s.collected) continue;
    if (s.type === 0) {
      // Сине-белая пивная баночка
      ctx.fillStyle = "#FFFFFF";
      fillRoundRect(s.x + 8, s.y, 30, 48, 6);
      ctx.fillStyle = "#0055D4";
      ctx.fillRect(s.x + 8, s.y + 12, 30, 22);
      ctx.fillStyle = "#CCCCCC";
      ctx.fillRect(s.x + 10, s.y, 26, 5);
    } else if (s.type === 1) {
      // Сыр Камамбер
      ctx.fillStyle = "#FFF8E7";
      fillOval(s.x, s.y + 10, s.x + 48, s.y + 44);
      ctx.fillStyle = "#FFD166";
      ctx.beginPath();
      ctx.moveTo(s.x + 24, s.y + 27);
      ctx.ellipse(s.x + 24, s.y + 27, 20, 13, 0, 0, Math.PI * 1.5);
      ctx.closePath();
      ctx.fill();
    } else if (s.type === 2) {
      // Пачка чипсов (красно-желтая)
      ctx.fillStyle = "#E63946";
      fillRoundRect(s.x + 4, s.y, 40, 48, 8);
      ctx.fillStyle = "#FFB703";
      ctx.beginPath();
      ctx.arc(s.x + 24, s.y + 24, 11, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Сушеная рыбка (вобла с хвостом и глазом)
      ctx.fillStyle = "#C68B59";
      fillOval(s.x, s.y + 14, s.x + 38, s.y + 36);
      ctx.beginPath();
      ctx.moveTo(s.x + 35, s.y + 25);
      ctx.lineTo(s.x + 48, s.y + 12);
      ctx.lineTo(s.x + 48, s.y + 38);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#FFFFFF";
      ctx.beginPath();
      ctx.arc(s.x + 10, s.y + 23, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Отрисовка злых бабок из общественного транспорта
  for (const g of grannies) {
    if (g.dead) continue;
    // Пальто/халат
    ctx.fillStyle = "#6D4C41";
    fillRoundRect(g.x + 10, g.y + 30, 45, 70, 10);
    // Голова в красном платочке
    ctx.fillStyle = "#D32F2F";
    ctx.beginPath();
    ctx.arc(g.x + 32, g.y + 20, 20, 0, Math.PI * 2);
    ctx.fill();
    // Лицо
    ctx.fillStyle = "#FFCCBC";
    ctx.beginPath();
    ctx.arc(g.x + 32, g.y + 22, 13, 0, Math.PI * 2);
    ctx.fill();
    // Злые брови и очки
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(g.x + 22, g.y + 16);
    ctx.lineTo(g.x + 42, g.y + 16);
    ctx.stroke();
    // Клетчатая сумка-тележка
    ctx.fillStyle = "#1976D2";
    ctx.fillRect(g.x - 8, g.y + 55, 22, 43);
  }

  // Принцесса Зайка
  drawPrincessBunny();

  // Главный герой — Волк
  drawWolf();

  // Зеленые облака ПУКА и ОТРЫЖКИ
  for (const c of gasClouds) {
    ctx.fillStyle = c.isBurp ? "rgba(120, 220, 40, 0.78)" : "rgba(150, 200, 30, 0.78)";
    ctx.beginPath();
    ctx.arc(c.x, c.y, 32, 0, Math.PI * 2);
    ctx.arc(c.x + 18, c.y - 12, 22, 0, Math.PI * 2);
    ctx.arc(c.x - 16, c.y + 10, 20, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#FFFFFF";
    ctx.font = "bold 24px sans-serif";
    ctx.fillText(c.isBurp ? "РЫГ!" : "ПУК!", c.x - 26, c.y + 8);
  }

  ctx.restore();

  // Верхний интерфейс и кнопки
  drawHUD();

  // Экран победы при спасении Зайки
  if (levelCompleted) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.78)";
    ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
    ctx.fillStyle = "#FFD700";
    ctx.font = "bold 44px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("ПРИНЦЕССА ЗАЙКА СПАСЕНА! 🐰👑", V_WIDTH / 2, V_HEIGHT * 0.43);
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "30px sans-serif";
    ctx.fillText("Коснись экрана для следующего уровня!", V_WIDTH / 2, V_HEIGHT * 0.56);
    ctx.textAlign = "left";
  }

  ctx.restore();
}

function inside(btn, x, y) {
  return x >= btn.left && x <= btn.right && y >= btn.top && y <= btn.bottom;
}

function handleTouches(e) {
  e.preventDefault();
  if (levelCompleted && e.type === 'touchstart') {
    levelNum++;
    setupLevel();
    return;
  }

  let leftHeld = false;
  let rightHeld = false;

  for (let i = 0; i < e.touches.length; i++) {
    const t = e.touches[i];
    const vx = t.clientX / scale;
    const vy = t.clientY / scale;
    if (inside(btnLeft, vx, vy)) leftHeld = true;
    if (inside(btnRight, vx, vy)) rightHeld = true;
  }
  moveLeft = leftHeld;
  moveRight = rightHeld;

  if (e.type === 'touchstart') {
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      const vx = t.clientX / scale;
      const vy = t.clientY / scale;
      if (inside(btnJump, vx, vy) && !isJumping) {
        wolfVy = -27;
        isJumping = true;
      }
      if (inside(btnFart, vx, vy)) triggerFart();
      if (inside(btnBurp, vx, vy)) triggerBurp();
    }
  }
}

canvas.addEventListener('touchstart', handleTouches, { passive: false });
canvas.addEventListener('touchmove', handleTouches, { passive: false });
canvas.addEventListener('touchend', handleTouches, { passive: false });
canvas.addEventListener('touchcancel', handleTouches, { passive: false });

// Поддержка мышки и клавиатуры на случай теста с ПК
canvas.addEventListener('mousedown', (e) => {
  if (levelCompleted) { levelNum++; setupLevel(); return; }
  const vx = e.clientX / scale;
  const vy = e.clientY / scale;
  if (inside(btnLeft, vx, vy)) moveLeft = true;
  if (inside(btnRight, vx, vy)) moveRight = true;
  if (inside(btnJump, vx, vy) && !isJumping) { wolfVy = -27; isJumping = true; }
  if (inside(btnFart, vx, vy)) triggerFart();
  if (inside(btnBurp, vx, vy)) triggerBurp();
});
window.addEventListener('mouseup', () => { moveLeft = false; moveRight = false; });

resize();
setupLevel();

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
