<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Алко-Волк: 3D Блокбастер</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: absolute; top: 20px; left: 20px; color: #fff;
    font-size: 24px; font-weight: 900; text-shadow: 2px 2px 4px #000, 0 0 10px #ff5722;
    pointer-events: none; z-index: 10;
  }
  .controls {
    position: absolute; bottom: 25px; width: 100%; display: flex;
    justify-content: space-between; padding: 0 25px; pointer-events: none; z-index: 10;
  }
  .btn-group { display: flex; gap: 18px; pointer-events: auto; }
  .c-btn {
    width: 80px; height: 80px; background: rgba(30,30,30,0.65);
    border: 3px solid rgba(255,255,255,0.8); border-radius: 50%;
    color: white; font-size: 26px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 15px rgba(0,0,0,0.7);
  }
  .c-btn:active { background: rgba(255,255,255,0.4); transform: scale(0.92); }
  .action-fart { background: rgba(100,200,20,0.75); border-color: #7cb518; }
  .action-jump { background: rgba(220,50,50,0.75); border-color: #ff5722; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="hud">ОЧКИ: <span id="scoreVal">0</span> | ЖИЗНИ: ❤️x<span id="lifeVal">3</span></div>

<div class="controls">
  <div class="btn-group">
    <div class="c-btn" id="leftBtn">◀</div>
    <div class="c-btn" id="rightBtn">▶</div>
  </div>
  <div class="btn-group">
    <div class="c-btn action-fart" id="fartBtn">ПУК</div>
    <div class="c-btn action-jump" id="jumpBtn">ПРЫГ</div>
  </div>
</div>

<script>
let scene, camera, renderer;
let wolf, snacks = [], grannies = [], particles = [], buildings = [];
let score = 0, lives = 3;
let moveLeft = false, moveRight = false, isJumping = false;
let wolfVy = 0;
const gravity = 0.016;

function init3D() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);
  scene.fog = new THREE.FogExp2(0x1a1a2e, 0.012);

  camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 4, 10);

  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // Освещение в стиле вечернего мегаполиса
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
  dirLight.position.set(15, 30, 15);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 1024;
  dirLight.shadow.mapSize.height = 1024;
  scene.add(dirLight);

  createCityEnvironment();
  createDetailedWolf();
  createGameEntities();
  initControls();
  window.addEventListener('resize', onWindowResize);
}

function createCityEnvironment() {
  // Дорога (асфальт)
  const roadGeo = new THREE.PlaneGeometry(200, 12);
  const roadMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
  const road = new THREE.Mesh(roadGeo, roadMat);
  road.rotation.x = -Math.PI / 2;
  road.position.set(0, 0, 0);
  road.receiveShadow = true;
  scene.add(road);

  // Разметка на дороге
  for (let i = -90; i < 100; i += 6) {
    const lineGeo = new THREE.BoxGeometry(2, 0.02, 0.4);
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffeb3b });
    const line = new THREE.Mesh(lineGeo, lineMat);
    line.position.set(i, 0.01, 0);
    scene.add(line);
  }

  // Тротуары и здания на заднем плане
  const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d });
  const swLeft = new THREE.Mesh(new THREE.PlaneGeometry(200, 3), sidewalkMat);
  swLeft.rotation.x = -Math.PI / 2;
  swLeft.position.set(0, 0.02, -7.5);
  swLeft.receiveShadow = true;
  scene.add(swLeft);

  const swRight = new THREE.Mesh(new THREE.PlaneGeometry(200, 3), sidewalkMat);
  swRight.rotation.x = -Math.PI / 2;
  swRight.position.set(0, 0.02, 7.5);
  swRight.receiveShadow = true;
  scene.add(swRight);

  // Процедурные многоэтажки по бокам
  const bMat = new THREE.MeshStandardMaterial({ color: 0x3b4252, roughness: 0.9 });
  for (let i = -80; i <= 90; i += 14) {
    const h = 12 + Math.random() * 15;
    const bGeo = new THREE.BoxGeometry(10, h, 8);
    const b = new THREE.Mesh(bGeo, bMat);
    b.position.set(i, h / 2, -13);
    b.castShadow = true;
    b.receiveShadow = true;
    scene.add(b);
    buildings.push(b);
  }
}

function createDetailedWolf() {
  const group = new THREE.Group();

  // Торс
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.1, 1.7, 0.7),
    new THREE.MeshStandardMaterial({ color: 0x7d8597, roughness: 0.5 })
  );
  body.position.y = 1.3;
  body.castShadow = true;
  group.add(body);

  // Яркие шорты
  const shorts = new THREE.Mesh(
    new THREE.BoxGeometry(1.15, 0.8, 0.75),
    new THREE.MeshStandardMaterial({ color: 0xff5722, roughness: 0.4 })
  );
  shorts.position.y = 0.55;
  shorts.castShadow = true;
  group.add(shorts);

  // Голова
  const head = new THREE.Mesh(
    new THREE.BoxGeometry(0.9, 0.9, 0.9),
    new THREE.MeshStandardMaterial({ color: 0x6c757d })
  );
  head.position.set(0, 2.5, 0.1);
  head.castShadow = true;
  group.add(head);

  // Массивные диджейские наушники
  const band = new THREE.Mesh(
    new THREE.TorusGeometry(0.55, 0.08, 8, 24, Math.PI),
    new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8 })
  );
  band.rotation.x = Math.PI / 2;
  band.position.set(0, 2.7, 0.1);
  group.add(band);

  const earmuffMat = new THREE.MeshStandardMaterial({ color: 0x00f5d4, emissive: 0x004433 });
  const leftEar = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.2, 16), earmuffMat);
  leftEar.rotation.z = Math.PI / 2;
  leftEar.position.set(-0.5, 2.5, 0.1);
  group.add(leftEar);

  const rightEar = leftEar.clone();
  rightEar.position.x = 0.5;
  group.add(rightEar);

  wolf = group;
  wolf.position.set(-8, 0, 0);
  scene.add(wolf);
}

function createGameEntities() {
  // Сине-белые пивные банки
  for (let i = -3; i <= 6; i += 3) {
    const canGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.8, 16);
    const canMat = new THREE.MeshStandardMaterial({ color: 0x0055d4, metalness: 0.6 });
    const can = new THREE.Mesh(canGeo, canMat);
    can.position.set(i * 3, 0.4, (Math.random() - 0.5) * 4);
    can.castShadow = true;
    scene.add(can);
    snacks.push(can);
  }

  // Злые бабки с тележками
  for (let i = -1; i <= 2; i++) {
    const gGroup = new THREE.Group();
    const gBody = new THREE.Mesh(
      new THREE.BoxGeometry(1.1, 1.9, 0.7),
      new THREE.MeshStandardMaterial({ color: 0x6d4c41 })
    );
    gBody.position.y = 0.95;
    gBody.castShadow = true;
    gGroup.add(gBody);

    const gHead = new THREE.Mesh(
      new THREE.SphereGeometry(0.45, 12, 12),
      new THREE.MeshStandardMaterial({ color: 0xd32f2f }) // Красный платочек
    );
    gHead.position.set(0, 2.1, 0);
    gGroup.add(gHead);

    gGroup.position.set(i * 8 + 5, 0, (Math.random() - 0.5) * 3);
    scene.add(gGroup);
    grannies.push({ mesh: gGroup, alive: true, speed: 0.035 * (i % 2 === 0 ? 1 : -1) });
  }
}

function spawnHollywoodExplosion(pos) {
  const count = 45;
  const geo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
  const mat = new THREE.MeshBasicMaterial({ color: 0xff5500 });

  for (let i = 0; i < count; i++) {
    const p = new THREE.Mesh(geo, mat);
    p.position.copy(pos);
    scene.add(p);
    particles.push({
      mesh: p,
      vx: (Math.random() - 0.5) * 0.4,
      vy: Math.random() * 0.4 + 0.1,
      vz: (Math.random() - 0.5) * 0.4,
      life: 50
    });
  }
}

function triggerFart() {
  spawnHollywoodExplosion(wolf.position);
  // Проверяем бабок поблизости для уничтожения
  grannies.forEach(g => {
    if (g.alive && g.mesh.position.distanceTo(wolf.position) < 5.5) {
      g.alive = false;
      scene.remove(g.mesh);
      spawnHollywoodExplosion(g.mesh.position);
      score += 150;
      document.getElementById('scoreVal').innerText = score;
    }
  });
}

function initControls() {
  const bind = (id, start, end) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); start(); });
    el.addEventListener('touchend', (e) => { e.preventDefault(); end(); });
    el.addEventListener('mousedown', () => start());
    el.addEventListener('mouseup', () => end());
  };

  bind('leftBtn', () => moveLeft = true, () => moveLeft = false);
  bind('rightBtn', () => moveRight = true, () => moveRight = false);
  bind('jumpBtn', () => {
    if (!isJumping) {
      wolfVy = 0.38;
      isJumping = true;
    }
  }, () => {});
  
  document.getElementById('fartBtn').addEventListener('touchstart', (e) => { e.preventDefault(); triggerFart(); });
  document.getElementById('fartBtn').addEventListener('mousedown', () => triggerFart());
}

function update() {
  const speed = 0.14;
  if (moveLeft) wolf.position.x -= speed;
  if (moveRight) wolf.position.x += speed;

  // Ограничение по границам улицы
  wolf.position.x = Math.max(-45, Math.min(45, wolf.position.x));

  // Гравитация и прыжок
  wolfVy -= gravity;
  wolf.position.y += wolfVy;
  if (wolf.position.y < 0) {
    wolf.position.y = 0;
    wolfVy = 0;
    isJumping = false;
  }

  // Камера динамически следует за Волком как в кино
  camera.position.x = wolf.position.x;
  camera.position.y = wolf.position.y + 3.5;
  camera.lookAt(wolf.position.x + 2, wolf.position.y + 1.5, 0);

  // Движение бабок
  grannies.forEach(g => {
    if (g.alive) {
      g.mesh.position.x += g.speed;
      if (g.mesh.position.x > wolf.position.x + 15 || g.mesh.position.x < wolf.position.x - 15) {
        g.speed = -g.speed;
      }
    }
  });

  // Сбор пивных банок
  snacks.forEach((s, idx) => {
    if (s && s.position.distanceTo(wolf.position) < 1.4) {
      scene.remove(s);
      snacks.splice(idx, 1);
      score += 50;
      document.getElementById('scoreVal').innerText = score;
    }
  });

  // Обновление частиц взрывов
  particles.forEach((p, idx) => {
    p.mesh.position.x += p.vx;
    p.mesh.position.y += p.vy;
    p.mesh.position.z += p.vz;
    p.vy -= 0.012;
    p.life--;
    if (p.life <= 0) {
      scene.remove(p.mesh);
      particles.splice(idx, 1);
    }
  });
}

function animate() {
  requestAnimationFrame(animate);
  update();
  renderer.render(scene, camera);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

init3D();
animate();
</script>
</body>
</html>
